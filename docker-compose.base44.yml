services:
  web:
    image: python:3.9-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE
      - PYTHONUNBUFFERED=1
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    command: ["sh", "-ec", "pip install --no-cache-dir -r requirements.txt && exec python app.py"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: on-failure
