name: 🚀 Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'projects/**'
  workflow_dispatch:

jobs:
  deploy-to-github-pages:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './projects'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      
      - name: Get latest issue number
        id: get-issue
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['opportunity'],
              state: 'open',
              sort: 'created',
              direction: 'desc',
              per_page: 1
            });
            
            return issues.data[0]?.number || '';
      
      - name: Update issue with deployment URL
        if: steps.get-issue.outputs.result != ''
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ fromJson(steps.get-issue.outputs.result).number }}
          body: |
            🎉 **¡Sitio desplegado exitosamente!**
            
            🔗 URL: ${{ steps.deployment.outputs.page_url }}
            
            ### Próximos pasos para monetizar:
            1. ✅ Registra el dominio en Google AdSense
            2. ✅ Añade enlaces de afiliado (Amazon Associates)
            3. ✅ Comparte en redes sociales
            4. ✅ Monitoriza tráfico con Google Analytics
            
            _El sitio está live y accesible 24/7_
            
            ---
            *Generado automáticamente por Auto-Income Agent*
